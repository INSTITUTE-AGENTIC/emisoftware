name: Build FocusTube APK

on:
  push:
    branches: [himanshus-videos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        run: base64 -d keystore.b64 > release.jks

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FocusTube.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: focustube-v${{ github.run_number }}
          name: "FocusTube v1.0.${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: FocusTube.apk
          body: "Download FocusTube.apk below and install it on your phone."
