name: Android agent build

on:
  push:
    paths:
      - 'android-agent/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android-agent/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest image ships an Android SDK preinstalled at
      # $ANDROID_HOME. The android-actions/setup-android@v3 action was tried
      # here first and failed — it unconditionally runs `sdkmanager tools`,
      # installing a legacy package Google removed from the SDK repository
      # years ago, which makes that action hard-fail on any current SDK
      # index. Using the preinstalled SDK directly avoids it.
      - name: Ensure required SDK packages are installed
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # No google-services.json is committed (see android-agent/.gitignore) —
      # the app/build.gradle.kts applies the Google Services plugin only
      # when that file exists, so debug assembly works without Firebase
      # configured. This CI run is a compile/lint check, not a release build.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
