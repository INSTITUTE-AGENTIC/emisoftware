android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Default Gradle daemon heap (512m-1g) OOMs during D8 dexing of the
# Compose/AndroidX dependency graph — seen failing in CI on
# :app:mergeExtDexDebug ("D8: java.lang.OutOfMemoryError"). GitHub's
# ubuntu-latest runners have 7GB RAM; 3g leaves headroom for everything else.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
